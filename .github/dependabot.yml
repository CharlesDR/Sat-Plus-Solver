# M2, R3: cautious grouped dependency updates. A month brings at most one npm PR
# and one GitHub Actions PR, with major, minor and patch versions grouped
# together. Nothing auto-merges: every update PR runs the full CI, e2e included,
# and is merged by hand on green. If a grouped major breaks CI, the fix goes in
# that PR, or only that package is split out of it. The Playwright container image in ci.yml follows the lockfile,
# so a @playwright/test bump updates both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [major, minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [major, minor, patch]
