# M2: cautious grouped dependency updates. Patch and minor versions arrive as one
# grouped PR a month; each major version gets its own PR. Nothing auto-merges:
# every update PR runs the full CI, e2e included, and is merged by hand on green,
# one at a time. The Playwright container image in ci.yml follows the lockfile,
# so a @playwright/test bump updates both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
